# Registry of optional features. Tooling and tests read it; Copier does not.
#
# Each feature is a question of the same name in copier.yml. `requires` and `conflicts` are the
# rules between features, and `npm: true` marks features that change package.json and so need
# their own lockfile (locks/<key>.json). docs/features.md explains how to add a feature.
features:
  zod:
    summary: Zod schema validation with a shared schema module in src/lib/schemas/
    requires: []
    conflicts: []
    npm: true
  forms:
    summary: React Hook Form with the Zod resolver and a small accessible example form
    requires: [zod]
    conflicts: []
    npm: true
  rest_api:
    summary: Versioned REST API v1 route handlers with shared Zod contracts and RFC 9457 problem-details errors
    requires: [zod]
    conflicts: []
    npm: false
  database:
    summary: A PostgreSQL database with version-controlled SQL migrations and a typed server-only data-access layer, run locally with Docker (postgres) or the Supabase CLI (supabase)
    choices: [postgres, supabase]
    requires: [zod]
    conflicts: []
    npm: true
  auth:
    summary: Better Auth email/password authentication with owner-scoped, row-level-secured data and a protected REST API, on either database provider
    requires: [zod, rest_api, database]
    conflicts: []
    npm: true
  native_client:
    summary: Bearer-token authentication for native clients (Better Auth bearer plugin) and a deterministic OpenAPI 3.1 contract for /api/v1, generated from the Zod schemas
    requires: [auth]
    conflicts: []
    npm: false
