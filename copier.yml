# web-core-template: the Web Core Copier template (Next.js, TypeScript, Tailwind, shadcn/ui).
# Independently versioned: releases are git tags (vMAJOR.MINOR.PATCH). Rendered from ./template.
# Validation lives here, with the template version that needs it, so raw `copier copy` and
# any CLI that wraps it enforce the same rules.
_min_copier_version: "9.19.1"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml
_exclude:
  - copier.yml
  - copier.yaml
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .svn
  - node_modules
  - .next

# Lockfiles live in locks/ (outside the rendered tree) and are selected by `lock_key` below.
# Optional features are questions of the same name as their entry in features.yml.

# Deliberately no `_tasks`, `_migrations` or `_jinja_extensions`: they execute code and
# would force users to run Copier with --trust. Generation only renders files.

# Booleans are written as `type: yaml` with `choices: [false, true]` and an `is boolean` validator,
# not `type: bool`. Copier casts a `bool` answer BEFORE validators run, so `--data zod=banana` was
# silently accepted as true. A `yaml` answer keeps its parsed type, so the validator can reject
# anything that is not a YAML boolean (`true`/`false`, `yes`/`no`, `on`/`off`, each in lower, Title
# or UPPER case); `banana`, `1`, `0`, `y`, `tRuE`, an empty string and null are rejected. Answers are still recorded as real
# booleans, so projects generated before this change keep working. Every boolean question must use
# this form (a test enforces it).

app_name:
  type: str
  help: "Application name (lowercase letters, digits and hyphens; used as the npm package name)"
  validator: >-
    {% if not (app_name | regex_search('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')) or (app_name | length) > 64 %}
    Use 1-64 lowercase letters, digits and single hyphens, starting with a letter.
    {% endif %}

app_description:
  type: str
  help: 'One-line description (ASCII letters, digits, spaces and . , ; : ! ? '' " ( ) / & + -)'
  default: A Next.js application
  validator: >-
    {% if not (app_description | regex_search('^[A-Za-z][A-Za-z0-9.,;:!?\x27\x22()/&+-]*( [A-Za-z0-9.,;:!?\x27\x22()/&+-]+)*$')) or (app_description | length) > 200 %}
    Use up to 200 ASCII letters, digits and . , ; : ! ? ' " ( ) / & + -, starting with a letter, with single spaces only.
    {% endif %}

cache_components:
  type: yaml  # a strict boolean: see the note above the questions
  default: true
  choices: [false, true]
  validator: >-
    {% if cache_components is not boolean %}Answer true or false.{% endif %}
  help: "Enable Next.js Cache Components with Partial Prefetching? (data fetching becomes dynamic by default and caching is opt-in; Next.js plans to make both universal in its next major release)"

zod:
  type: yaml  # a strict boolean: see the note above the questions
  default: false
  choices: [false, true]
  validator: >-
    {% if zod is not boolean %}Answer true or false.{% endif %}
  help: "Add Zod schema validation? (adds the exact-pinned `zod` dependency, a shared schema module in src/lib/schemas/ and its tests)"

forms:
  type: yaml  # a strict boolean: see the note above the questions
  default: false
  choices: [false, true]
  validator: >-
    {% if forms is not boolean %}Answer true or false.{% elif forms and not zod %}forms requires zod: answer zod=true as well (forms is never enabled for you).{% endif %}
  help: "Add React Hook Form? (requires zod; adds exact-pinned react-hook-form and @hookform/resolvers, a small example form at /forms-example validated by a shared schema, and DOM test libraries as dev dependencies)"

# Computed: never asked and never recorded. Selects the lockfile that matches the selected
# dependencies. It must agree with tools/features.py; a test renders every valid configuration
# and checks that the lockfile it receives is the one that module names.
lock_key:
  type: str
  when: false
  default: "{{ 'forms+zod' if forms else ('zod' if zod else 'base') }}"
