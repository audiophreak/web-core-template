[project]
name = "web-core-template-dev"
version = "0.0.0"
description = "Test environment for the web-core Copier template (not a published package)."
requires-python = ">=3.12"
dependencies = [
  "copier==9.19.1",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
]

[tool.uv]
package = false
# Only resolve packages published before this date (rolling two-week supply-chain buffer).
exclude-newer = "2026-11-02T00:00:00Z"
python-downloads = "never"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra"
# Each end-to-end test installs a whole application (hundreds of megabytes of node_modules). Pytest itself
# removes the temporary directory of a test that passed, and keeps the ones that failed for inspection,
# so a run does not fill the disk of a CI runner. (This repository's own code deletes nothing.)
tmp_path_retention_policy = "failed"
markers = [
  "e2e: generates a project and runs npm ci / npm run check (slow, needs network and Node 26)",
  "db: runs a real database in Docker (needs a running Docker daemon; CI runs these in their own job)",
]
